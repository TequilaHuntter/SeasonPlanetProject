<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Season Planet · 专注星球</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>✦ SEASON PLANET</span><span id="wallet"></span></header><section class="intro"><small>让每一段专注，都长出一点生机</small><h1>留一点时间，<br>种一颗自己的星球。</h1><p>安排好四块小小的土地，让星球陪你度过一个季节。</p></section><div class="layout"><section class="planet-panel"><div class="season" id="season"></div><div class="orbit"><div class="planet" id="plots"></div><span class="star s1">✧</span><span class="star s2">✦</span></div><div id="metrics" class="metrics"></div><div class="valuation"><span>星球改造价值 <b id="value"></b></span><button id="sellPlanet">出售星球</button></div></section><aside><section class="card focus"><small>这一季，专注于眼前</small><div id="clock">30:00</div><p id="status"></p><div class="buttons"><button class="primary" id="start">开始专注</button><button id="cancel">放弃计时</button></div><label class="demo"><input type="checkbox" id="demo"> 快速试玩 · 每季 10 秒</label><p class="hint">切到其他页面会暂停，回来后点击继续。正式模式每季30分钟。</p></section><section class="card"><h2>种子商店 <span id="selection">先选择一块土地</span></h2><div id="shop"></div></section></aside></div><section class="card warehouse"><div><h2>收获仓库</h2><p id="inventory"></p></div><button id="sellCrops">出售全部作物</button></section><section class="card"><h2>星球日志</h2><p id="log" aria-live="polite"></p></section><footer>玩法原型 v0.1 · 示例美术与数值 · 进度保存在当前浏览器 <button id="reset">重置进度</button></footer></main><div id="toast" role="status"></div><script src="core.js"></script><script src="app.js"></script></body></html>
